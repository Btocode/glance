name: Bug report
description: Something in Glance does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. A few things first:

        > [!WARNING]
        > **Never paste the text you were typing, real messages, API keys or tokens here.** Issues are public. Describe the text instead ("a two-line Slack message with a link") or use made-up text that shows the same problem.

        Found a privacy leak or a security problem (text where it should not be, an edit typed into the wrong window, a key outside the keyring)? Please **do not** open an issue: report it privately as described in [SECURITY.md](https://github.com/Btocode/glance/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what Glance did instead.
      placeholder: |
        1. Typed a sentence with a typo in a Slack message field
        2. The strip showed the fix
        3. Pressed Alt+Enter
        4. Expected: the sentence replaced. Got: ...
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App where it happened
      description: The app and, for a browser, the site type (not the URL if it is private). Include the version if you know it.
      placeholder: e.g. Slack 4.41 (Electron), Chrome 158 on a web mail compose box, gedit 41
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of Glance?
      multiple: true
      options:
        - Grammar strip / Alt+Enter
        - Panel / tone rewrites
        - Select-anything (Super+Alt+A)
        - Autocomplete
        - Claude Code Ctrl+G
        - Hotkeys
        - Tray / onboarding window
        - glance doctor
        - Installer / uninstaller
        - Other
  - type: dropdown
    id: backend
    attributes:
      label: AI backend
      options:
        - None (grammar only)
        - claude
        - codex
        - gemini
        - opencode
        - API key (Anthropic)
        - API key (OpenAI-compatible)
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: e.g. Ubuntu 22.04
    validations:
      required: true
  - type: input
    id: session
    attributes:
      label: Desktop and session
      description: Glance needs X11. `echo $XDG_SESSION_TYPE` should print `x11`.
      placeholder: e.g. GNOME 42 on Xorg ("Ubuntu on Xorg")
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Glance version
      description: "For an installed copy: `git -C ~/.local/share/glance-src rev-parse --short HEAD`"
      placeholder: e.g. fcdae34
  - type: textarea
    id: doctor
    attributes:
      label: "`glance doctor` output"
      description: Paste the output of `glance doctor`. It contains no typed text, but check it for anything you would rather not share (paths with your user name, for example) before posting.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: "`journalctl --user -u glance.service -n 100 --no-pager`. Glance logs never contain typed text; still, read before you paste."
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I did not paste any typed text, real messages, API keys or tokens.
          required: true
        - label: I searched the existing issues for this bug.
          required: true
