name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # The default suite: no real display, no real apps, no paid calls. Its X tests start
    # their own private Xvfb. The system Python (3.10 on 22.04) is used on purpose: the GTK,
    # AT-SPI and Wnck bindings come from apt, as they do for users.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-atspi-2.0 gir1.2-wnck-3.0 \
            gir1.2-notify-0.7 gir1.2-secret-1 gir1.2-ayatanaappindicator3-0.1 \
            xvfb dbus at-spi2-core zsh shellcheck

      - uses: astral-sh/setup-uv@v6

      - name: Fetch harper-ls
        run: scripts/fetch-harper.sh

      - name: Create the venv
        run: |
          uv venv --python /usr/bin/python3 --system-site-packages .venv
          uv pip install --python .venv/bin/python -e ".[dev]" maturin

      # The in-process grammar engine (rust/glance_core). Built into the venv so the default
      # suite runs the native unit tests and the harper-ls parity test against the real
      # harper-ls fetched above.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Rust unit tests
        working-directory: rust
        run: |
          cargo fmt --check
          cargo test --no-default-features

      - name: Build glance_core into the venv
        working-directory: rust/glance_core
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: ../../.venv/bin/maturin develop --release --uv

      - name: Run the default test suite
        run: .venv/bin/pytest -ra

      - name: Grammar parity (glance_core vs harper-ls 3.3.0)
        env:
          GLANCE_REQUIRE_CORE: "1"
        run: .venv/bin/pytest -ra -s tests/test_grammar_parity.py tests/test_harper_native.py
