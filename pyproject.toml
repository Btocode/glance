[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glance"
version = "0.1.0"
description = "System-wide writing assistant for Linux/X11"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
dependencies = ["tomli>=2", "httpx>=0.27,<1", "tomlkit>=0.12,<1", "python-xlib>=0.29,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
glance = "glance.cli:main"
glanced = "glance.daemon.main:main"
glance-capture = "glance.capture.main:main"
glance-edit = "glance.edit_shim.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/glance"]

[tool.pytest.ini_options]
addopts = '-m "not desktop and not apps and not paid and not xvfb"'
pythonpath = ["."]
markers = [
    "desktop: needs a live X session and AT-SPI bus",
    "apps: needs real third-party apps",
    "paid: calls a paid API",
    "xvfb: end to end on a private Xvfb + D-Bus session (never the user's display); slow, opt in with -m xvfb",
]

[tool.ruff]
line-length = 100
target-version = "py310"
