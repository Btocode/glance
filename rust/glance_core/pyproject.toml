[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "glance-core"
version = "0.1.0"
description = "Glance's display-free core (in-process Harper grammar checking)"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: Implementation :: CPython"]

[tool.maturin]
features = ["python"]
module-name = "glance_core"
