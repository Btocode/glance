<!doctype html><meta charset="utf-8"><title>glance fixture: password</title>
<link rel="stylesheet" href="page.css">
<input id="editor" type="password" aria-label="password" autocomplete="off">
<script type="module">
import { install, cpIndex, utf16Index } from "./bridge.js";
const el = document.getElementById("editor");
install({
  getText: () => el.value,
  getCaret: () => cpIndex(el.value, el.selectionEnd),
  setCaret: (n) => { el.focus(); const i = utf16Index(el.value, n); el.setSelectionRange(i, i); },
  setText: (s) => { el.value = s; },
  focus: () => el.focus(),
});
</script>
